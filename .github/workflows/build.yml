name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端的快速反馈：格式、lint、类型、单测。不依赖 ESP-IDF 容器。
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          working-directory: embed-web
          node-version-file: .node-version
          run-install: "false"
          cache: true

      - name: Install dependencies
        working-directory: embed-web
        run: vp install --frozen-lockfile

      - name: Check (format + lint + types)
        working-directory: embed-web
        run: vp check

      - name: Test
        working-directory: embed-web
        run: vp test

  # 固件里与 ESP-IDF 解耦的纯逻辑模块，用系统编译器直接跑，不需要硬件或 QEMU。
  firmware-unit-tests:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and run host tests
        run: |
          cmake -S test/host -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      # 装进独立 venv 并用绝对路径调用：runner 上 pipx 的 bin 目录位置并不固定
      - name: Check C formatting
        run: |
          python3 -m venv /tmp/clang-format-venv
          /tmp/clang-format-venv/bin/pip install --quiet clang-format==20.1.7
          /tmp/clang-format-venv/bin/clang-format --dry-run --Werror \
            components/*/*.c components/*/include/*.h \
            main/*.c main/*.h test/host/*.c test/host/*.h

  firmware:
    name: Build firmware and merged image
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v6
        with:
          # CMake 用 `git rev-list --count HEAD` 生成固件版本号，浅克隆会让它恒为 1
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # 便宜的检查放在构建之前，快速失败
      - name: Check Kconfig style
        run: |
          . "$IDF_PATH/export.sh"
          python -m kconfcheck components/*/Kconfig main/Kconfig.projbuild
          python -m kconfcheck --check deprecated components/*/Kconfig main/Kconfig.projbuild

      # ESP-IDF 容器是 Ubuntu，Vite+ 自带 Node.js 与包管理器供给
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          working-directory: embed-web
          node-version-file: .node-version
          run-install: "false"
          cache: true

      # 托管组件按 lockfile 缓存：它记录的是实际解析出的版本
      - name: Cache IDF managed components
        uses: actions/cache@v5
        with:
          path: managed_components
          key: idf-managed-${{ hashFiles('dependencies.lock') }}

      - name: Install web dependencies
        working-directory: embed-web
        run: vp install --frozen-lockfile

      # 单步完成：vp build（CMake build_web target）+ 固件 + merged bin
      - name: Build firmware, web and merged binary
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          cmake --build build --target merged_bin

      # clang-tidy 需要 build/compile_commands.json，所以必须排在构建之后
      - name: Cache esp-clang
        uses: actions/cache@v5
        with:
          path: /opt/esp/tools/esp-clang
          key: esp-clang-idf-v6.0.2

      - name: Static analysis (clang-tidy)
        run: |
          . "$IDF_PATH/export.sh"
          python "$IDF_PATH/tools/idf_tools.py" install esp-clang
          . "$IDF_PATH/export.sh"
          ./tools/clang-check.sh

      - name: Static analysis (cppcheck)
        run: |
          apt-get update -qq && apt-get install -y -qq cppcheck
          . "$IDF_PATH/export.sh"
          ./tools/cppcheck.sh

      - name: Firmware size budget
        run: python3 tools/check-size.py

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-${{ github.sha }}
          path: warnings.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect release artifacts
        run: |
          PROJECT=$(python3 -c "import json; print(json.load(open('build/project_description.json'))['project_name'])")

          mkdir -p release

          cp build/bootloader/bootloader.bin           release/
          cp build/partition_table/partition-table.bin release/
          cp build/ota_data_initial.bin                release/
          cp "build/${PROJECT}.bin"                    release/
          cp build/web.bin                             release/
          cp "build/${PROJECT}-merged.bin"             release/
          cp build/flasher_args.json                   release/
          cp -r embed-web/dist                         release/web-dist

          # 生成可读的烧录说明（含偏移地址表 + esptool 命令）
          GITHUB_SHA="${{ github.sha }}" python3 - <<'EOF'
          import json, os

          with open('build/flasher_args.json') as f:
              args = json.load(f)

          project = json.load(open('build/project_description.json'))['project_name']
          s       = args['flash_settings']
          chip    = args['extra_esptool_args']['chip']
          sha     = os.environ.get('GITHUB_SHA', 'unknown')[:8]
          flags   = (f"--chip {chip} --flash-mode {s['flash_mode']} "
                     f"--flash-size {s['flash_size']} --flash-freq {s['flash_freq']}")
          files   = sorted(args['flash_files'].items(), key=lambda item: int(item[0], 16))

          md = [
              "# 烧录说明\n\n",
              f"> Commit: `{sha}`\n\n",
              "## 准备\n\n```bash\npip install esptool\n```\n\n",
              "## 全量烧录（新板初始化，推荐）\n\n",
              "```bash\n",
              f"esptool {flags} write-flash 0x0 {project}-merged.bin\n",
              "```\n\n",
              "## 单分区烧录\n\n",
              "| 文件 | 偏移地址 |\n|------|----------|\n",
          ]
          for offset, path in files:
              md.append(f"| `{path.split('/')[-1]}` | `{offset}` |\n")

          md.append("\n```bash\n")
          md.append(f"esptool {flags} write-flash \\\n")
          md.append(" \\\n".join(f"  {offset} {path.split('/')[-1]}" for offset, path in files))
          md.append("\n```\n\n")
          md += [
              "## 只更新固件（保留已保存的配置）\n\n",
              "```bash\n",
              f"esptool {flags} write-flash "
              f"{[o for o, p in files if p.endswith(project + '.bin')][0]} {project}.bin\n",
              "```\n",
          ]

          with open('release/FLASH_INSTRUCTIONS.md', 'w') as f:
              f.writelines(md)

          print("Artifacts:")
          for name in sorted(os.listdir('release')):
              print(f"  {name:45s} {os.path.getsize('release/' + name):>12,} B")
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: release/
          retention-days: 30

  release:
    name: Publish release
    needs: [web, firmware-unit-tests, firmware]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release/FLASH_INSTRUCTIONS.md \
            release/*.bin release/flasher_args.json
